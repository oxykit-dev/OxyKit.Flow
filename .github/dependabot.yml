version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns:
          - Microsoft.*
      opentelemetry:
        patterns:
          - OpenTelemetry*
      test:
        patterns:
          - xunit*
          - FluentAssertions*
