name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore OxyKit.Flow.slnx
      - name: Build
        run: dotnet build OxyKit.Flow.slnx --no-restore -c Release
      - name: Test
        run: |
          dotnet test tests/OxyKit.Flow.Tests/OxyKit.Flow.Tests.csproj --no-build -c Release --verbosity normal
